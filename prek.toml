# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]
minimum_prek_version = "0.5.10"
default_install_hook_types = ["pre-push"]

# Tag-eligibility rules for `prek update`. Without these, `update` picked lychee's
# `nightly` tag — a moving prerelease republished daily, which defeats reproducible
# hook installs and which prek then cannot detect changes to after first install.
[update]
exclude_tags = ["nightly"]

# lychee publishes two tag series from one repo: `lychee-v*` (the CLI, what the hook
# runs) and `lychee-lib-v*` (the library crate). Pin updates to the CLI series.
[update.repos."https://github.com/lycheeverse/lychee"]
include_tags = ["lychee-v*"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-added-large-files", args = ["--maxkb=1024"], priority = 0 },
  { id = "check-case-conflict", priority = 0 },
  { id = "check-merge-conflict", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-json", priority = 0 },
  { id = "check-yaml", priority = 0 },
  { id = "check-symlinks", priority = 0 },
  { id = "mixed-line-ending", args = ["--fix=lf"], priority = 0 },
  { id = "detect-private-key", priority = 0 },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.49.0"  # prek autoupdate will fill this
hooks = [{ id = "typos", priority = 1, stages = ["pre-push"] }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.1"
hooks = [
  { id = "ruff-check", priority = 1, stages = ["pre-push"] },
  { id = "ruff-format", args = ["--check"], priority = 1, stages = ["pre-push"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    # The best-practices rules skill-validator lacks. The docstring of the script says when to retire each.
    id = "skill-best-practices",
    name = "Best-practices checks skill-validator lacks",
    language = "system",
    entry = "uv run python scripts/validate_skills.py",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"],
    priority = 1
  },
  {
    id = "ty",
    name = "Type-check with ty",
    language = "system",
    entry = "uvx ty check .",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"],
    priority = 1
  },
]

# The Agent Skills spec. `check .` skips dot-directories, so the project skills get a run of their own.
# It exits 2 on a warning, so a warning fails the push too.
[[repos]]
repo = "https://github.com/agent-ecosystem/skill-validator"
rev = "v1.8.0"
hooks = [
  {
    id = "skill-validator",
    name = "skill-validator (published skills)",
    args = ["check", ".", "--allow-dirs=evals"],
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"],
    priority = 1
  },
  {
    id = "skill-validator",
    alias = "skill-validator-project",
    name = "skill-validator (project skills)",
    args = ["check", ".agents/skills", "--allow-dirs=evals"],
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"],
    priority = 1
  },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.49.1"
hooks = [
  {
    id = "markdownlint",
    # skill-creator test cases open with a settings block in the format `claude plugin eval` reads, not a heading.
    exclude = "(^|/)evals/",
    priority = 1,
    stages = ["pre-push"],
    types_or = ["markdown"]
  }
]

# CHANGELOG.md's Keep a Changelog structure: section names, ISO dates, version order.
# .kacl.yml turns off its check for its own boilerplate sentences, which differ from ours.
[[repos]]
repo = "https://gitlab.com/schmieder.matthias/python-kacl"
rev = "v0.7.7"
hooks = [{ id = "kacl-verify", priority = 1, stages = ["pre-push"] }]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"  # tag series constrained in [update.repos] above
hooks = [
  {
    id = "lychee",
    args = ["--no-progress"],
    priority = 1,
    stages = ["pre-push"],
    types_or = ["markdown"]
  }
]
