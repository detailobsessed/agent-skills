[project]
name = "agent-skills"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.5.10,<0.6",
    "skills-ref>=0.1.1",
]

# Read by the changelog-validate hook in prek.toml.
[tool.changelogmanager.versioning]
scheme = "calver"

[tool.ruff]
target-version = "py314"
line-length = 100
# Eval fixtures are deliberately rough input for an agent to fix, and import
# libraries this repo does not install.
extend-exclude = ["plugins/*/evals/*/files"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["plugins/*/evals/*/files"]
